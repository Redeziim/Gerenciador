<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de agentes</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #1d1c19;
      --surface: #262520;
      --surface-raised: #302e28;
      --text: #f2eee7;
      --muted: #b8b0a4;
      --border: #49453d;
      --accent: #d97757;
      --accent-text: #1d1c19;
      --good: #8fc7a1;
      --wait: #b9ad8c;
      --bad: #e19085;
      --focus: #f3ad76;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f4ee;
        --surface: #fffdf9;
        --surface-raised: #f3eee6;
        --text: #26221e;
        --muted: #625c54;
        --border: #cbc2b6;
        --accent: #a84c2e;
        --accent-text: #fffdf9;
        --good: #286f42;
        --wait: #75602b;
        --bad: #a83a35;
        --focus: #a84c2e;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 0; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .shell { width: min(100% - 32px, 1100px); margin: 0 auto; padding: 32px 0 72px; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 38px; }
    .eyebrow { margin: 0 0 4px; color: var(--accent); font: 600 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 36px); line-height: 1.2; overflow-wrap: anywhere; }
    h2 { margin: 0 0 16px; font-size: 19px; line-height: 1.3; }
    .live { display: inline-flex; align-items: center; gap: 8px; flex: none; margin-top: 4px; color: var(--good); font-size: 13px; white-space: nowrap; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .live.offline { color: var(--muted); }
    .live.offline::before { background: var(--bad); }
    section + section { margin-top: 38px; }
    .agent-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .agent-card, .task-row, .empty { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .agent-card { min-width: 0; padding: 17px; }
    .agent-card h3 { margin: 0 0 7px; font: 600 16px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .agent-value { min-height: 44px; margin: 0; color: var(--muted); overflow-wrap: anywhere; }
    .agent-note { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .text-button { margin-top: 14px; padding: 6px 0; border: 0; background: none; color: var(--accent); font-weight: 600; }
    .text-button:hover { text-decoration: underline; }
    .config-form { display: grid; gap: 11px; margin-top: 13px; padding-top: 14px; border-top: 1px solid var(--border); }
    .field { display: grid; gap: 5px; min-width: 0; }
    label { font-size: 13px; font-weight: 600; }
    input, select { width: 100%; min-width: 0; padding: 8px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-raised); color: var(--text); }
    .form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .primary { padding: 8px 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .secondary { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); }
    .primary:hover { filter: brightness(1.1); }
    .secondary:hover { background: var(--surface-raised); }
    .form-error { margin: 0; color: var(--bad); font-size: 13px; overflow-wrap: anywhere; }
    .form-error:empty { display: none; }
    .tasks { display: grid; gap: 8px; }
    .task-row { display: flex; align-items: flex-start; gap: 8px; min-width: 0; padding: 0 12px; }
    .task-row details { flex: 1; min-width: 0; }
    .task-row summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 11px; min-width: 0; padding: 13px 0; cursor: pointer; list-style: none; }
    .task-row summary::-webkit-details-marker { display: none; }
    .task-row summary::after { content: "⌄"; margin-left: auto; color: var(--muted); }
    .task-row details[open] summary::after { content: "⌃"; }
    .glyph { flex: none; width: 16px; color: var(--muted); font-size: 17px; line-height: 1; text-align: center; }
    .status-running .glyph { color: var(--accent); }
    .status-waiting .glyph { color: var(--wait); }
    .status-done .glyph { color: var(--good); }
    .status-failed .glyph { color: var(--bad); }
    .task-name { font: 600 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .task-meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .task-title { flex-basis: 100%; padding-left: 27px; color: var(--text); overflow-wrap: anywhere; }
    .task-extra { display: grid; gap: 8px; padding: 0 0 14px 27px; font-size: 13px; overflow-wrap: anywhere; }
    .extra-label { margin-right: 7px; color: var(--muted); }
    .cancel-button { flex: none; align-self: flex-start; margin: 12px 0; padding: 3px 7px; border: 1px solid var(--border); border-radius: 5px; background: transparent; color: var(--text); font-size: 12px; }
    .cancel-button:hover { background: var(--surface-raised); }
    .empty { padding: 20px; color: var(--muted); }
    @media (max-width: 820px) { .agent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 480px) {
      .shell { width: min(100% - 24px, 1100px); padding-top: 22px; }
      .header { gap: 8px; margin-bottom: 30px; }
      .live { font-size: 12px; }
      .agent-grid { grid-template-columns: 1fr; }
      .agent-value { min-height: 0; }
      .task-row { padding: 0 10px; }
      .task-row summary { gap: 4px 7px; }
      .task-title, .task-extra { padding-left: 23px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">Gerenciador de agentes</p>
        <h1 id="project-name">Projeto</h1>
      </div>
      <span id="live-indicator" class="live" role="status" aria-live="polite">Conectando…</span>
    </header>

    <section aria-labelledby="agents-heading">
      <h2 id="agents-heading">Agentes</h2>
      <div id="agents" class="agent-grid"></div>
    </section>

    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Quadro de tarefas</h2>
      <div id="tasks" class="tasks"></div>
    </section>
  </main>

  <script>
    'use strict';

    const agentNames = { gerente: 'Gerente', codex: 'Codex', claude: 'Claude subagentes', gemini: 'Gemini' };
    const levels = ['low', 'medium', 'high', 'xhigh', 'max'];
    const agentsElement = document.getElementById('agents');
    const tasksElement = document.getElementById('tasks');
    const projectElement = document.getElementById('project-name');
    const liveElement = document.getElementById('live-indicator');
    let agentSignature = '';
    let taskSignature = '';
    let taskTimes = [];
    let polling = false;
    let activeForm = null;
    let lastAgents = null;

    function make(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined && value !== null) node.textContent = String(value);
      return node;
    }

    function display(value, fallback = '—') {
      return value === null || value === undefined || value === '' ? fallback : String(value);
    }

    function agentDescription(key, data) {
      if (key === 'gemini') return 'desligado — só se você citar';
      const model = display(data?.modelo);
      if (key === 'codex') return model + ' · ' + (data?.nivel_fixo ? data.nivel_fixo + ' (fixo)' : 'por tarefa');
      return model + ' · ' + display(data?.nivel);
    }

    function field(form, labelText, control) {
      const wrapper = make('div', 'field');
      const label = make('label', '', labelText);
      control.id = 'config-' + activeForm + '-' + labelText.toLowerCase();
      label.htmlFor = control.id;
      wrapper.append(label, control);
      form.append(wrapper);
      return control;
    }

    function levelSelect(value, optional) {
      const select = make('select');
      if (optional) select.append(new Option('Opcional', ''));
      for (const level of levels) select.append(new Option(level, level));
      select.value = value && levels.includes(value) ? value : (optional ? '' : 'medium');
      return select;
    }

    function openForm(key) {
      if (activeForm === key) { activeForm = null; renderAgents(lastAgents); return; }
      activeForm = key;
      renderAgents(lastAgents);
      const form = agentsElement.querySelector('form');
      if (form) form.querySelector('input, select')?.focus();
    }

    function buildForm(key, data) {
      const form = make('form', 'config-form');
      const controls = {};
      if (key === 'gerente' || key === 'claude') {
        const input = make('input');
        input.type = 'text';
        input.autocomplete = 'off';
        input.value = key === 'claude' ? display(data?.modelo, 'auto') : display(data?.modelo, '');
        if (key === 'gerente') {
          input.required = true;
          input.setAttribute('list', 'gerente-modelos');
          const list = make('datalist');
          list.id = 'gerente-modelos';
          for (const model of ['opus', 'sonnet', 'haiku']) {
            const option = make('option');
            option.value = model;
            list.append(option);
          }
          form.append(list);
        }
        controls.model = field(form, 'Modelo', input);
      }
      if (key === 'codex') {
        const select = make('select');
        select.append(new Option('auto · por tarefa', 'auto'));
        for (const level of levels) select.append(new Option(level, level));
        select.value = data?.nivel_fixo && levels.includes(data.nivel_fixo) ? data.nivel_fixo : 'auto';
        controls.level = field(form, 'Nível', select);
      } else {
        controls.level = field(form, 'Nível', levelSelect(data?.nivel, key === 'claude'));
      }
      const error = make('p', 'form-error');
      error.setAttribute('role', 'alert');
      const actions = make('div', 'form-actions');
      const save = make('button', 'primary', 'Salvar');
      save.type = 'submit';
      const close = make('button', 'secondary', 'Fechar');
      close.type = 'button';
      close.addEventListener('click', () => { activeForm = null; renderAgents(lastAgents); });
      actions.append(save, close);
      form.append(error, actions);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        const model = controls.model?.value.trim();
        const args = key === 'codex' ? [controls.level.value]
          : key === 'gerente' ? [model, controls.level.value]
          : !model || model.toLowerCase() === 'auto' ? ['auto']
          : controls.level.value ? [model, controls.level.value] : [model];
        save.disabled = true;
        try {
          const updated = await request('../../api/config', { method: 'POST', body: JSON.stringify({ alvo: key, args }) });
          activeForm = null;
          agentSignature = JSON.stringify(updated);
          renderAgents(updated);
        } catch (reason) {
          error.textContent = reason.message;
        } finally {
          save.disabled = false;
        }
      });
      return form;
    }

    function renderAgents(data) {
      lastAgents = data;
      const cards = [];
      for (const key of ['gerente', 'codex', 'claude', 'gemini']) {
        const card = make('article', 'agent-card');
        card.append(make('h3', '', agentNames[key]), make('p', 'agent-value', agentDescription(key, data?.[key])));
        if (key === 'gerente') card.append(make('p', 'agent-note', 'vale na próxima abertura; na sessão aberta use /model e /effort'));
        if (key !== 'gemini') {
          const button = make('button', 'text-button', activeForm === key ? 'Ocultar' : 'Alterar');
          button.type = 'button';
          button.setAttribute('aria-expanded', String(activeForm === key));
          button.addEventListener('click', () => openForm(key));
          card.append(button);
          if (activeForm === key) card.append(buildForm(key, data?.[key]));
        }
        cards.push(card);
      }
      agentsElement.replaceChildren(...cards);
    }

    function statusInfo(status) {
      const normalized = String(status || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (normalized === 'rodando') return { glyph: '●', className: 'status-running', cancellable: true };
      if (normalized === 'aguardando') return { glyph: '◌', className: 'status-waiting', cancellable: true };
      if (normalized === 'concluida') return { glyph: '✓', className: 'status-done', cancellable: false };
      if (normalized === 'cancelada') return { glyph: '⊘', className: 'status-cancelled', cancellable: false };
      if (normalized === 'falhou' || normalized === 'bloqueada') return { glyph: '✗', className: 'status-failed', cancellable: false };
      return { glyph: '•', className: '', cancellable: false };
    }

    function elapsed(start, end) {
      if (!start) return '—';
      const beginning = Date.parse(start);
      const ending = end ? Date.parse(end) : Date.now();
      if (!Number.isFinite(beginning) || !Number.isFinite(ending)) return '—';
      const seconds = Math.max(0, Math.floor((ending - beginning) / 1000));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainder = seconds % 60;
      return hours ? `${hours}h ${String(minutes).padStart(2, '0')}m` : minutes ? `${minutes}m ${String(remainder).padStart(2, '0')}s` : `${remainder}s`;
    }

    function extraLine(label, value) {
      const line = make('div');
      line.append(make('span', 'extra-label', label), make('span', '', value));
      return line;
    }

    function renderTasks(tasks) {
      const openNames = new Set([...tasksElement.querySelectorAll('details[open]')].map(node => node.dataset.name));
      taskTimes = [];
      if (!Array.isArray(tasks) || tasks.length === 0) {
        tasksElement.replaceChildren(make('p', 'empty', 'Nenhuma tarefa no quadro.'));
        return;
      }
      const rows = tasks.map((task) => {
        const info = statusInfo(task.status);
        const row = make('article', 'task-row ' + info.className);
        const details = make('details');
        details.dataset.name = display(task.nome, '');
        details.open = openNames.has(details.dataset.name);
        const summary = make('summary');
        const glyph = make('span', 'glyph', info.glyph);
        glyph.setAttribute('aria-hidden', 'true');
        const time = make('span', 'task-meta');
        taskTimes.push({ node: time, start: task.inicio, end: task.fim });
        summary.append(glyph, make('span', 'task-name', display(task.nome)), make('span', 'task-meta', display(task.agente)), make('span', 'task-meta', display(task.status)), time, make('span', 'task-title', display(task.titulo)));
        const extra = make('div', 'task-extra');
        extra.append(
          extraLine('Reservas', Array.isArray(task.reservas) && task.reservas.length ? task.reservas.join(', ') : '—'),
          extraLine('Depois', Array.isArray(task.depois) && task.depois.length ? task.depois.join(', ') : '—'),
          extraLine('Branch', display(task.branch))
        );
        details.append(summary, extra);
        row.append(details);
        if (info.cancellable) {
          const cancel = make('button', 'cancel-button', 'Cancelar');
          cancel.type = 'button';
          cancel.setAttribute('aria-label', 'Cancelar tarefa ' + display(task.nome));
          cancel.addEventListener('click', async () => {
            if (!confirm('Cancelar a tarefa ' + display(task.nome) + '?')) return;
            cancel.disabled = true;
            try {
              await request('../../api/cancelar', { method: 'POST', body: JSON.stringify({ nome: task.nome }) });
              await refresh();
            } catch (reason) {
              alert(reason.message);
              cancel.disabled = false;
            }
          });
          row.append(cancel);
        }
        return row;
      });
      tasksElement.replaceChildren(...rows);
      updateTimes();
    }

    function updateTimes() {
      for (const item of taskTimes) item.node.textContent = elapsed(item.start, item.end);
    }

    async function request(path, options) {
      const response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...options?.headers }
      });
      let body;
      try { body = await response.json(); } catch { body = null; }
      if (!response.ok) throw new Error(body?.erro || `Erro da API (${response.status})`);
      return body;
    }

    async function refresh() {
      if (polling) return;
      polling = true;
      const results = await Promise.allSettled([request('../../api/quadro'), request('../../api/agentes')]);
      const [board, agents] = results;
      if (board.status === 'fulfilled') {
        projectElement.textContent = display(board.value?.projeto, 'Projeto');
        const tasks = board.value?.tarefas;
        const nextSignature = JSON.stringify(tasks);
        if (nextSignature !== taskSignature) {
          taskSignature = nextSignature;
          renderTasks(tasks);
        } else updateTimes();
      }
      if (agents.status === 'fulfilled') {
        const nextSignature = JSON.stringify(agents.value);
        if (nextSignature !== agentSignature) {
          agentSignature = nextSignature;
          if (!activeForm) renderAgents(agents.value);
          else lastAgents = agents.value;
        }
      }
      const healthy = board.status === 'fulfilled' && agents.status === 'fulfilled';
      liveElement.textContent = healthy ? 'ao vivo' : 'sem conexão';
      liveElement.classList.toggle('offline', !healthy);
      polling = false;
    }

    renderAgents(null);
    renderTasks([]);
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
