<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Níveis de raciocínio</title>
  <rect width="1600" height="520" rx="28" fill="#1f1d1b"/>
  <rect x="1.5" y="1.5" width="1597" height="517" rx="27" fill="none" stroke="#3a3632" stroke-width="3"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#ece6de">Um nível para cada tarefa</text>

  <!-- degraus -->
  <rect x="60" y="270" width="470" height="100" rx="18" fill="#2a2724" stroke="#7fbf8e" stroke-width="3"/>
  <rect x="565" y="200" width="470" height="170" rx="18" fill="#2a2724" stroke="#d9b25f" stroke-width="3"/>
  <rect x="1070" y="130" width="470" height="240" rx="18" fill="#2a2724" stroke="#d97757" stroke-width="3"/>

  <text x="90" y="318" font-size="38" font-weight="800" fill="#7fbf8e" font-family="ui-monospace,Menlo,Consolas,monospace">medium</text>
  <text x="90" y="352" font-size="23" fill="#ece6de">tarefa comum</text>

  <text x="595" y="248" font-size="38" font-weight="800" fill="#d9b25f" font-family="ui-monospace,Menlo,Consolas,monospace">high</text>
  <text x="595" y="288" font-size="23" fill="#ece6de">difícil: vários arquivos,</text>
  <text x="595" y="320" font-size="23" fill="#ece6de">refatoração, bug difícil</text>

  <text x="1100" y="178" font-size="38" font-weight="800" fill="#d97757" font-family="ui-monospace,Menlo,Consolas,monospace">xhigh</text>
  <text x="1100" y="218" font-size="23" fill="#ece6de">crítica: arquitetura, segurança,</text>
  <text x="1100" y="250" font-size="23" fill="#ece6de">migração de dados, ou quando</text>
  <text x="1100" y="282" font-size="23" fill="#ece6de">o high falhou</text>

  <!-- faixa -->
  <rect x="60" y="400" width="1480" height="64" rx="18" fill="#2a2724" stroke="#3a3632" stroke-width="2"/>
  <text x="90" y="440" font-size="24" fill="#ece6de"><tspan font-weight="700">Quem executa:</tspan> Codex sol e Claude Sonnet. <tspan font-weight="700">Gerente e autor dos prompts:</tspan> Opus.</text>
  <text x="60" y="496" font-size="20" fill="#a59e94">low, max e Haiku só se você pedir.</text>
</svg>
