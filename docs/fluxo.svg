<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>Fluxo do Gerenciador</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97757"/>
    </marker>
    <marker id="setaf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a59e94"/>
    </marker>
  </defs>
  <rect width="1600" height="700" rx="28" fill="#1f1d1b"/>
  <rect x="1.5" y="1.5" width="1597" height="697" rx="27" fill="none" stroke="#3a3632" stroke-width="3"/>
  <text x="60" y="64" font-size="34" font-weight="700" fill="#ece6de">Do pedido ao merge</text>

  <!-- setas -->
  <g stroke="#d97757" stroke-width="3.5" fill="none" marker-end="url(#seta)">
    <line x1="250" y1="360" x2="286" y2="360"/>
    <line x1="580" y1="330" x2="626" y2="165"/>
    <line x1="580" y1="360" x2="626" y2="360"/>
    <line x1="990" y1="165" x2="1057" y2="338"/>
    <line x1="990" y1="360" x2="1056" y2="360"/>
    <line x1="1318" y1="360" x2="1398" y2="360"/>
  </g>
  <line x1="580" y1="390" x2="626" y2="555" stroke="#a59e94" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#setaf)"/>

  <!-- 1 Voce -->
  <rect x="50" y="270" width="200" height="180" rx="20" fill="#2a2724" stroke="#3a3632" stroke-width="2"/>
  <text x="150" y="338" text-anchor="middle" font-size="32" font-weight="700" fill="#ece6de">Você</text>
  <text x="150" y="376" text-anchor="middle" font-size="21" fill="#a59e94">um pedido</text>
  <text x="150" y="404" text-anchor="middle" font-size="21" fill="#a59e94">em português</text>

  <!-- 2 Gerente -->
  <rect x="290" y="250" width="290" height="220" rx="20" fill="#2a2724" stroke="#d97757" stroke-width="3"/>
  <text x="435" y="312" text-anchor="middle" font-size="27" font-weight="700" fill="#ece6de">Gerente (Opus)</text>
  <text x="435" y="358" text-anchor="middle" font-size="21" fill="#a59e94">divide o pedido e</text>
  <text x="435" y="386" text-anchor="middle" font-size="21" fill="#a59e94">escreve o prompt</text>
  <text x="435" y="414" text-anchor="middle" font-size="21" fill="#a59e94">de cada tarefa</text>

  <!-- 3 Agentes -->
  <rect x="630" y="90" width="358" height="150" rx="20" fill="#2a2724" stroke="#7fbf8e" stroke-width="3"/>
  <text x="660" y="140" font-size="30" font-weight="700" fill="#ece6de">Codex sol</text>
  <text x="660" y="182" font-size="21" fill="#a59e94">worktree + branch</text>
  <text x="660" y="212" font-size="22" fill="#7fbf8e" font-family="ui-monospace,Menlo,Consolas,monospace">codex/tarefa-1</text>

  <rect x="630" y="285" width="358" height="150" rx="20" fill="#2a2724" stroke="#d9b25f" stroke-width="3"/>
  <text x="660" y="335" font-size="30" font-weight="700" fill="#ece6de">Claude Sonnet</text>
  <text x="660" y="377" font-size="21" fill="#a59e94">worktree + branch</text>
  <text x="660" y="407" font-size="22" fill="#d9b25f" font-family="ui-monospace,Menlo,Consolas,monospace">claude/tarefa-2</text>

  <g opacity="0.5">
    <rect x="630" y="480" width="358" height="150" rx="20" fill="#2a2724" stroke="#a59e94" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="660" y="530" font-size="30" font-weight="700" fill="#ece6de">Gemini</text>
    <text x="660" y="572" font-size="21" fill="#a59e94">só se você citar</text>
  </g>
  <text x="809" y="665" text-anchor="middle" font-size="20" fill="#a59e94">em paralelo, cada um na sua cópia</text>

  <!-- 4 Revisao -->
  <rect x="1060" y="270" width="258" height="180" rx="20" fill="#2a2724" stroke="#3a3632" stroke-width="2"/>
  <text x="1189" y="330" text-anchor="middle" font-size="28" font-weight="700" fill="#ece6de">Gerente revisa</text>
  <text x="1189" y="372" text-anchor="middle" font-size="22" fill="#a59e94">o diff e faz</text>
  <text x="1189" y="402" text-anchor="middle" font-size="22" fill="#a59e94">o merge</text>

  <!-- 5 main -->
  <rect x="1400" y="305" width="150" height="110" rx="20" fill="#d97757"/>
  <text x="1475" y="373" text-anchor="middle" font-size="36" font-weight="800" fill="#1f1d1b" font-family="ui-monospace,Menlo,Consolas,monospace">main</text>

  <!-- numeros -->
  <g font-size="22" font-weight="800" text-anchor="middle" fill="#1f1d1b">
    <circle cx="50" cy="270" r="19" fill="#d97757"/><text x="50" y="278">1</text>
    <circle cx="290" cy="250" r="19" fill="#d97757"/><text x="290" y="258">2</text>
    <circle cx="630" cy="90" r="19" fill="#d97757"/><text x="630" y="98">3</text>
    <circle cx="1060" cy="270" r="19" fill="#d97757"/><text x="1060" y="278">4</text>
    <circle cx="1400" cy="305" r="19" fill="#ece6de"/><text x="1400" y="313">5</text>
  </g>
</svg>
